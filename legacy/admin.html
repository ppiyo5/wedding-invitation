<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>초대 링크 관리 — 추연학 ♡ 홍은미</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ───────── Invitation design tokens ───────── */
:root {
  --c-bg: #f8f7f6;
  --c-surface: #ffffff;
  --c-ink: #262322;
  --c-muted: #66605d;
  --c-line: #e7e3e1;
  --c-field-line: #948c88;
  /* Soft greige (muted mocha-taupe): a light, near-achromatic main colour —
     the lightest value that still keeps 4.5:1 for white button text */
  --c-accent: #7a706b;
  --c-accent-strong: #5f5753;
  --c-spring: #4d6a2f;
  --c-spring-soft: #e8f0de;
  --c-accent-ink: #ffffff;
  --c-accent-soft: #f1eeec;
  --c-sun: #a8433e;
  --c-error: #b3261e;
  --c-success: #2f6b4a;
  --c-scrim: rgba(28, 25, 23, .48);

  --f-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-body: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;

  --t-xs: 12px;
  --t-sm: 14px;
  --t-md: 16px;
  --t-lg: 20px;
  --t-xl: 24px;
  --t-2xl: 32px;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 20px;

  --d-fast: 160ms;
  --d-base: 240ms;
  --d-slow: 360ms;
  --e-out: cubic-bezier(.2, .7, .2, 1);
  --e-in: cubic-bezier(.5, 0, .75, 0);
  --d-reveal: 400ms;
  --d-aos: 600ms;
  --e-aos: ease;
  --aos-distance: 50px;

  --c-intro-bg: #2b2826;
  --c-intro-ink: #f8f7f6;
  --c-intro-muted: #cfc8c4;
}

.inv {
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.7;
  color: var(--c-ink);
  background: var(--c-bg);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.inv h1, .inv h2, .inv h3, .inv p { margin: 0; }
.inv button { font: inherit; color: inherit; }
.inv a { color: inherit; }
.inv :focus-visible,
.overlay :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; border-radius: var(--r-sm); }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.od-icon { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.section { padding: var(--s-8) var(--s-5); }
.section + .section { border-top: 1px solid var(--c-line); }
.section--tint { background: var(--c-surface); }
.eyebrow {
  display: block;
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: .24em;
  color: var(--c-accent);
  text-align: center;
}
.section-title {
  margin-top: var(--s-2) !important;
  font-family: var(--f-display);
  font-size: var(--t-xl);
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.section-lead { margin-top: var(--s-3) !important; color: var(--c-muted); text-align: center; font-size: var(--t-sm); }
.section-body { margin-top: var(--s-6); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 48px; padding: 0 var(--s-5);
  border-radius: var(--r-md); border: 1px solid var(--c-line);
  background: var(--c-surface); font-size: var(--t-md); font-weight: 600;
  cursor: pointer; text-decoration: none;
  transition: background-color var(--d-fast) var(--e-out), border-color var(--d-fast) var(--e-out);
}
.btn--primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-ink) !important; }
.btn--block { width: 100%; }
.btn--sm { min-height: 44px; padding: 0 var(--s-4); font-size: var(--t-sm); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
@media (hover: hover) {
  .btn:hover { border-color: var(--c-accent); background: var(--c-accent-soft); }
  .btn--primary:hover { background: var(--c-accent-strong); border-color: var(--c-accent-strong); }
}

/* cover */
.cover { padding: var(--s-6) var(--s-5) var(--s-8); text-align: center; }
.cover-date {
  font-family: var(--f-display);
  font-size: var(--t-lg);
  letter-spacing: .12em;
}
.cover-day { font-size: var(--t-xs); letter-spacing: .32em; color: var(--c-muted); font-weight: 600; }
.cover-photo { margin: var(--s-5) 0 0; border-radius: var(--r-sm); overflow: hidden; }
.cover-names {
  margin-top: var(--s-6) !important;
  font-family: var(--f-display);
  font-size: var(--t-2xl);
  font-weight: 700;
  line-height: 1.3;
  display: flex; justify-content: center; align-items: center; gap: var(--s-3);
}
.cover-names .amp { font-size: var(--t-lg); color: var(--c-accent); font-weight: 400; }
.cover-meta { margin-top: var(--s-4); color: var(--c-muted); }
.cover-meta > span { display: block; }

/* invitation */
.poem { font-family: var(--f-display); font-size: 17px; line-height: 2; text-align: center; }
.poem + .poem { margin-top: var(--s-5) !important; }
.parents { margin-top: var(--s-7); display: grid; gap: var(--s-3); justify-items: center; }
.parent-line { display: flex; align-items: baseline; justify-content: center; gap: var(--s-2); flex-wrap: wrap; }
.parent-line .who { font-size: var(--t-lg); font-family: var(--f-display); font-weight: 700; }
.parent-line .rel { font-size: var(--t-sm); color: var(--c-muted); }
.deceased { font-size: var(--t-xs); }
.contact-cta { margin-top: var(--s-6); display: flex; justify-content: center; }

/* calendar */
.cal { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--s-5) var(--s-4); }
.cal-head { text-align: center; font-family: var(--f-display); font-size: var(--t-lg); font-weight: 700; }
.cal-grid { margin-top: var(--s-4); --od-cols: 7; --od-gap: 4px; text-align: center; font-size: var(--t-sm); }
.cal-grid .dow { color: var(--c-muted); font-size: var(--t-xs); font-weight: 600; padding-bottom: var(--s-2); }
.cal-grid .day { display: grid; place-items: center; height: 40px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-grid .sun { color: var(--c-sun); }
.cal-grid .is-wedding { background: var(--c-accent); color: var(--c-accent-ink); font-weight: 700; aspect-ratio: 1; height: auto; width: 40px; justify-self: center; }
.dday { margin-top: var(--s-6); --od-cols: 4; --od-gap: var(--s-2); }
.dday .od-stat { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--s-3) 0; text-align: center; }
.dday .num { font-size: clamp(22px, 6.4vw, 26px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.2; }
.dday .cap { font-size: var(--t-xs); color: var(--c-muted); }
.dday-copy { margin-top: var(--s-4); text-align: center; font-size: var(--t-sm); color: var(--c-muted); }
.dday-copy strong { color: var(--c-accent); }

/* gallery */
.gallery { --od-cols: 3; --od-gap: 4px; }
.gallery button { padding: 0; border: 0; background: var(--c-line); cursor: zoom-in; border-radius: 4px; overflow: hidden; display: block; }
.gallery img { transition: transform var(--d-base) var(--e-out); }
@media (hover: hover) { .gallery button:hover img { transform: scale(1.03); } }
.gallery-hint { margin-top: var(--s-3) !important; text-align: center; font-size: var(--t-xs); color: var(--c-muted); }

/* location */
.venue { text-align: center; }
.venue-name { font-family: var(--f-display); font-size: var(--t-lg); font-weight: 700; }
.venue-addr { color: var(--c-muted); font-size: var(--t-sm); }
.venue-tel { font-size: var(--t-sm); color: var(--c-muted); }
.map { margin-top: var(--s-5); border: 1px solid var(--c-line); border-radius: var(--r-md); overflow: hidden; background: #eef1ef; position: relative; }
.map svg { display: block; width: 100%; height: auto; }
.map-note { position: absolute; top: var(--s-2); left: var(--s-2); font-size: var(--t-xs); background: rgba(255,255,255,.92); padding: 2px var(--s-2); border-radius: 4px; color: var(--c-muted); }
.map-actions { margin-top: var(--s-3); --od-cols: 3; --od-gap: var(--s-2); }
.map-actions .btn { padding: 0 var(--s-2); font-size: var(--t-sm); }
.addr-copy { margin-top: var(--s-2); }
.transit { margin-top: var(--s-6); display: grid; gap: var(--s-5); }
.transit-item { --od-gap: var(--s-3); }
.transit-icon { --od-icon-size: 20px; width: 40px; height: 40px; border-radius: 50%; background: var(--c-accent-soft); color: var(--c-accent); display: grid; place-items: center; }
.transit-item h3 { font-size: var(--t-md); font-weight: 700; line-height: 1.5; }
.transit-item p { font-size: var(--t-sm); color: var(--c-muted); line-height: 1.7; }

/* accounts */
.acc-group { border: 1px solid var(--c-line); border-radius: var(--r-md); background: var(--c-surface); overflow: hidden; }
.acc-group + .acc-group { margin-top: var(--s-3); }
.acc-toggle {
  width: 100%; min-height: 56px; padding: 0 var(--s-4);
  border: 0; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  font-weight: 600; text-align: left;
}
.acc-toggle .chev { --od-icon-size: 20px; color: var(--c-muted); transition: transform var(--d-base) var(--e-out); }
.acc-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-panel { border-top: 1px solid var(--c-line); }
.acc-panel[hidden] { display: none; }
.acc-row { padding: var(--s-3) var(--s-4); --od-gap: var(--s-3); }
.acc-row + .acc-row { border-top: 1px dashed var(--c-line); }
.acc-row .holder { font-size: var(--t-sm); color: var(--c-muted); }
.acc-row .number { font-size: var(--t-md); font-weight: 600; font-variant-numeric: tabular-nums; }

/* rsvp */
.rsvp-card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--s-5); text-align: center; }
.rsvp-card p { color: var(--c-muted); font-size: var(--t-sm); }
.rsvp-card .btn { margin-top: var(--s-5); }
.rsvp-status { margin-top: var(--s-3) !important; color: var(--c-success) !important; font-weight: 600; }
.rsvp-status[hidden] { display: none; }

/* guestbook */
.gb-form { display: grid; gap: var(--s-3); }
.gb-list { margin: var(--s-5) 0 0; padding: 0; list-style: none; display: grid; gap: var(--s-3); }
.gb-item { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--s-4); }
.gb-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); }
.gb-name { font-weight: 700; font-size: var(--t-sm); }
.gb-date { font-size: var(--t-xs); color: var(--c-muted); white-space: nowrap; }
.gb-msg { margin-top: var(--s-1) !important; font-size: var(--t-sm); white-space: pre-wrap; }
.gb-empty { margin-top: var(--s-5) !important; text-align: center; color: var(--c-muted); font-size: var(--t-sm); padding: var(--s-6) var(--s-4); border: 1px dashed var(--c-line); border-radius: var(--r-md); }
.gb-empty[hidden] { display: none; }
.gb-more { margin-top: var(--s-3); }
.gb-more[hidden] { display: none; }

/* forms */
.field { --od-gap: var(--s-1); text-align: left; }
.field label, .field legend, .field .label { font-size: var(--t-sm); font-weight: 600; }
.req { color: var(--c-error); margin-left: 2px; }
.input, .textarea {
  width: 100%; min-height: 48px; padding: var(--s-3);
  border: 1px solid var(--c-field-line); border-radius: var(--r-sm);
  background: var(--c-surface); font: inherit; font-size: var(--t-md); color: var(--c-ink);
  transition: border-color var(--d-fast) var(--e-out);
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
.input:focus, .textarea:focus { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }
.field.is-invalid .input, .field.is-invalid .textarea { border-color: var(--c-error); }
.field-error { font-size: var(--t-xs); color: var(--c-error); display: flex !important; gap: var(--s-1); align-items: center; }
.field-error[hidden] { display: none !important; }
.field-error .od-icon { --od-icon-size: 14px; }
.field-help { font-size: var(--t-xs); color: var(--c-muted); }
fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
fieldset.field legend { padding: 0; margin-bottom: var(--s-1); }
.seg { display: grid; grid-template-columns: repeat(var(--seg-cols, 2), minmax(0, 1fr)); gap: var(--s-2); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  display: flex; align-items: center; justify-content: center; min-height: 48px;
  border: 1px solid var(--c-field-line); border-radius: var(--r-sm); cursor: pointer;
  font-weight: 500; font-size: var(--t-sm); background: var(--c-surface);
  transition: background-color var(--d-fast) var(--e-out), border-color var(--d-fast) var(--e-out);
}
.seg input:checked + label { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-ink); font-weight: 700; }
.seg input:focus-visible + label { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.stepper { display: flex; align-items: center; gap: var(--s-2); }
.stepper button { width: 48px; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--c-field-line); background: var(--c-surface); cursor: pointer; display: grid; place-items: center; }
.stepper button[disabled] { opacity: .4; cursor: not-allowed; }
.stepper output { min-width: 64px; text-align: center; font-weight: 700; font-size: var(--t-lg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.form-summary { border: 1px solid var(--c-error); background: #fcefee; color: var(--c-error); border-radius: var(--r-sm); padding: var(--s-3) var(--s-4); font-size: var(--t-sm); }
.form-summary[hidden] { display: none; }
.form-summary ul { margin: var(--s-1) 0 0; padding-left: var(--s-4); }
.form-summary a { color: inherit; }

/* share & closing */
.closing { text-align: center; }
.closing figure { margin: 0 0 var(--s-6); border-radius: var(--r-sm); overflow: hidden; }
.closing p { font-family: var(--f-display); font-size: 17px; line-height: 1.9; }
.share-row { margin-top: var(--s-6); --od-cols: 2; --od-gap: var(--s-2); }
.footer { padding: var(--s-6) var(--s-5) var(--s-7); text-align: center; font-size: var(--t-xs); color: var(--c-muted); }

/* scroll fade-up (set up by aos.js) — same timing as the reference invitation:
   600ms (slowed from the reference's 400ms), ease, rising 50px, each block on its own */
/* same blocks as AOS_SELECTOR in aos.js — hidden from first paint so nothing flashes */
.cover > *,
.reveal > :not(.section-body),
.reveal > .section-body > * {
  opacity: 0;
  transform: translate3d(0, var(--aos-distance), 0);
  transition: opacity var(--d-aos) var(--e-aos), transform var(--d-aos) var(--e-aos);
}
[data-aos-in] { opacity: 1 !important; transform: none !important; }
/* after its one entrance, a block keeps no transform (so it can't drift or re-animate) */
[data-aos-done] { transition: none !important; }

/* ───────── Overlays (mounted inside the phone screen) ───────── */
.overlay { position: absolute; inset: 0; z-index: 40; font-family: var(--f-body); color: var(--c-ink); word-break: keep-all; }
.overlay[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: var(--c-scrim); opacity: 0; transition: opacity var(--d-base) var(--e-out); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: calc(100% - var(--phone-safe-top) - 24px);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--c-surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
  transform: translateY(100%); transition: transform var(--d-slow) var(--e-out);
  box-shadow: 0 -8px 32px rgba(0,0,0,.12);
}
.overlay.is-open .scrim { opacity: 1; }
.overlay.is-open .sheet { transform: none; }
.overlay.is-closing .scrim { opacity: 0; transition-duration: var(--d-fast); transition-timing-function: var(--e-in); }
.overlay.is-closing .sheet { transform: translateY(100%); transition-duration: var(--d-base); transition-timing-function: var(--e-in); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-3) var(--s-2) var(--s-5); }
.sheet-head::before { content: ""; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 99px; background: var(--c-line); }

          <div class="seg">
            <input type="radio" name="new-side" id="new-side-0" value="신랑측" checked /><label for="new-side-0">신랑측</label>
            <input type="radio" name="new-side" id="new-side-1" value="신부측" /><label for="new-side-1">신부측</label>
          </div>
        </fieldset>
        <button type="submit" class="btn btn--primary admin-add-btn"><svg class="od-icon" aria-hidden="true"><use href="#i-plus" /></svg> 추가</button>
      </form>

      <details class="admin-bulk">
        <summary>여러 명 한 번에 추가</summary>
        <div class="admin-bulk-body">
          <div class="field od-field">
            <label for="bulk-names">이름 목록</label>
            <textarea id="bulk-names" class="textarea" rows="5" aria-describedby="bulk-help"></textarea>
            <span class="field-help" id="bulk-help">한 줄에 한 명씩, 또는 쉼표로 구분해 붙여넣으세요. 이미 있는 이름은 건너뜁니다.</span>
          </div>
          <fieldset class="field od-field">
            <legend>구분</legend>
            <div class="seg">
              <input type="radio" name="bulk-side" id="bulk-side-0" value="신랑측" checked /><label for="bulk-side-0">신랑측</label>
              <input type="radio" name="bulk-side" id="bulk-side-1" value="신부측" /><label for="bulk-side-1">신부측</label>
            </div>
          </fieldset>
          <button type="button" class="btn btn--block" id="bulk-add">목록에 추가</button>
        </div>
      </details>
    </section>

    <section class="admin-card" aria-labelledby="h-list">
      <div class="admin-list-head">
        <h2 class="admin-h2" id="h-list">초대 목록</h2>
        <p class="admin-stats" id="stats"></p>
      </div>
      <div class="admin-toolbar">
        <div class="field od-field admin-search">
          <label for="search">이름 검색</label>
          <input id="search" class="input" type="search" />
        </div>
        <fieldset class="field od-field">
          <legend>보기</legend>
          <div class="seg" style="--seg-cols: 3">
            <input type="radio" name="filter" id="filter-0" value="전체" checked /><label for="filter-0">전체</label>
            <input type="radio" name="filter" id="filter-1" value="신랑측" /><label for="filter-1">신랑측</label>
            <input type="radio" name="filter" id="filter-2" value="신부측" /><label for="filter-2">신부측</label>
          </div>
        </fieldset>
      </div>
      <div class="admin-inline">
        <button type="button" class="btn btn--sm" id="copy-all"><svg class="od-icon" aria-hidden="true"><use href="#i-copy" /></svg> 보이는 링크 모두 복사</button>
        <button type="button" class="btn btn--sm" id="export-csv">CSV 내려받기</button>
      </div>
      <p class="admin-empty" id="empty" hidden></p>
      <ul class="guest-list" id="list"></ul>
    </section>

    <p class="admin-note">목록은 지금 쓰는 브라우저에만 저장됩니다. 다른 기기에서 쓰려면 CSV로 내려받아 두세요.</p>
  </div>

  <div class="toast admin-toast" id="toast" role="status" aria-live="polite">
    <svg class="od-icon" aria-hidden="true"><use href="#i-check" /></svg><span id="toast-msg"></span>
  </div>

  <script>
  (() => {
    const GUESTS_KEY = "inv-admin-guests";
    const BASE_KEY = "inv-admin-base";
    const SIDES = ["신랑측", "신부측"];
    const NAME_MAX = 20;
    const DUP_MSG = '이미 목록에 있는 이름이에요. 구분이 필요하면 "홍길동(회사)"처럼 적어 주세요.';

    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const icon = (id) => `<svg class="od-icon" aria-hidden="true"><use href="#i-${id}" /></svg>`;
    const cleanName = (raw) => Array.from(String(raw).replace(/\s+/g, " ").trim()).slice(0, NAME_MAX).join("");
    const newId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

    /* The invitation sits next to this page: http(s) → folder URL, file:// → its index.html */
    function defaultBase() {
      const dir = location.href.split(/[?#]/)[0].replace(/[^/]*$/, "");
      return location.protocol === "file:" ? `${dir}index.html` : dir;
    }
    function buildLink(base, name) {
      const b = base.trim();
      if (!b) return `?to=${encodeURIComponent(name)}`;
      const [noHash, hash] = b.split("#");
      const sep = noHash.includes("?") ? (/[?&]$/.test(noHash) ? "" : "&") : "?";
      return `${noHash}${sep}to=${encodeURIComponent(name)}${hash ? `#${hash}` : ""}`;
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; }
      catch {
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand("copy"); } catch {}
        ta.remove(); return ok;
      }
    }
    let toastTimer;
    function toast(msg) {
      $("#toast-msg").textContent = msg;
      $("#toast").classList.add("is-shown");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $("#toast").classList.remove("is-shown"), 2200);
    }

    const state = {
      guests: (() => { try { const s = JSON.parse(localStorage.getItem(GUESTS_KEY)); return Array.isArray(s) ? s : []; } catch { return []; } })(),
      base: (() => { try { return localStorage.getItem(BASE_KEY) || defaultBase(); } catch { return defaultBase(); } })(),
      query: "",
      filter: "전체",
      editing: null,
      editError: "",
      confirming: null,
    };
    const save = () => { try { localStorage.setItem(GUESTS_KEY, JSON.stringify(state.guests)); } catch {} };
    const isDuplicate = (n, exceptId) => state.guests.some((g) => g.name === n && g.id !== exceptId);
    const visible = () => {
      const q = state.query.trim();
      return state.guests.filter((g) => (state.filter === "전체" || g.side === state.filter) && (!q || g.name.includes(q)));
    };

    function render() {
      const vis = visible();
      const sent = state.guests.filter((g) => g.sent).length;
      $("#stats").innerHTML = `<span class="od-nowrap">총 ${state.guests.length}명</span> · <span class="od-nowrap">보냄 ${sent}명</span>`;
      $("#copy-all").disabled = !vis.length;
      $("#export-csv").disabled = !vis.length;
      const empty = $("#empty");
      if (!state.guests.length) {
        empty.innerHTML = "아직 받는 분이 없어요.<br />위에서 이름을 추가하면 그 사람만의 초대 링크가 만들어집니다.";
        empty.hidden = false;
      } else if (!vis.length) {
        empty.textContent = "조건에 맞는 분이 없어요. 검색어나 보기 설정을 바꿔 보세요.";
        empty.hidden = false;
      } else {
        empty.hidden = true;
      }
      $("#list").hidden = !vis.length;
      $("#list").innerHTML = vis.map((g) => {
        const link = buildLink(state.base, g.name);
        const n = esc(g.name);
        if (state.editing === g.id) {
          return `<li class="guest-row" data-id="${g.id}">
            <div class="guest-main">
              <div class="field od-field guest-edit${state.editError ? " is-invalid" : ""}">
                <label for="edit-${g.id}">이름 수정</label>
                <div class="od-row">
                  <input id="edit-${g.id}" class="input od-fill" maxlength="${NAME_MAX}" value="${n}" aria-invalid="${!!state.editError}" aria-describedby="edit-err-${g.id}" data-edit-input />
                  <button type="button" class="btn btn--sm btn--primary od-fixed" data-act="save">저장</button>
                  <button type="button" class="btn btn--sm od-fixed" data-act="cancel-edit">취소</button>
                </div>
                <span class="field-error" id="edit-err-${g.id}"${state.editError ? "" : " hidden"}>${icon("alert")}<span>${esc(state.editError)}</span></span>
              </div>
            </div>
          </li>`;
        }
        const del = state.confirming === g.id
          ? `<span class="confirm-delete" role="group" aria-label="${n} 삭제 확인">
               <button type="button" class="btn btn--sm btn--danger" data-act="delete">삭제</button>
               <button type="button" class="btn btn--sm" data-act="cancel-delete">취소</button>
             </span>`
          : `<button type="button" class="btn btn--sm btn--ghost-danger" data-act="confirm" aria-label="${n} 삭제">삭제</button>`;
        return `<li class="guest-row${g.sent ? " is-sent" : ""}" data-id="${g.id}">
          <div class="guest-main">
            <div class="od-field">
              <span class="guest-name-line">
                <span class="guest-name-text">${n}</span>
                <span class="side-chip side-${SIDES.indexOf(g.side)}">${esc(g.side)}</span>
              </span>
              <a class="guest-link od-truncate" href="${esc(link)}" target="_blank" rel="noopener noreferrer" title="${esc(link)}">${esc(link)}</a>
            </div>
          </div>
          <div class="guest-actions">
            <label class="sent-toggle"><input type="checkbox" data-act="sent"${g.sent ? " checked" : ""} /><span>보냄</span></label>
            <button type="button" class="btn btn--sm" data-act="copy" aria-label="${n} 링크 복사">${icon("copy")} 복사</button>
            <a class="btn btn--sm" href="${esc(link)}" target="_blank" rel="noopener noreferrer" aria-label="${n} 청첩장 미리보기 (새 탭)">미리보기</a>
            <button type="button" class="btn btn--sm" data-act="edit" aria-label="${n} 이름 수정">수정</button>
            ${del}
          </div>
        </li>`;
      }).join("");
      if (state.editing) {
        const input = $("[data-edit-input]");
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }

    /* base url */
    const baseInput = $("#base-url");
    baseInput.value = state.base;
    baseInput.addEventListener("input", () => {
      state.base = baseInput.value;
      try { localStorage.setItem(BASE_KEY, state.base); } catch {}
      render();
    });
    $("#base-reset").addEventListener("click", () => {
      state.base = defaultBase();
      baseInput.value = state.base;
      try { localStorage.setItem(BASE_KEY, state.base); } catch {}
      render();
    });

    /* add one */
    function setNameError(msg) {
      $("#new-name-field").classList.toggle("is-invalid", !!msg);
      $("#new-name").setAttribute("aria-invalid", String(!!msg));
      $("#new-name-msg").textContent = msg;
      $("#new-name-err").hidden = !msg;
    }
    $("#new-name").addEventListener("blur", (e) => { if (cleanName(e.target.value) && $("#new-name-field").classList.contains("is-invalid")) setNameError(""); });
    $("#add-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const n = cleanName($("#new-name").value);
      if (!n) { setNameError("받는 분 이름을 입력해 주세요."); $("#new-name").focus(); return; }
      if (isDuplicate(n)) { setNameError(DUP_MSG); $("#new-name").focus(); return; }
      const side = $('input[name="new-side"]:checked').value;
      state.guests.unshift({ id: newId(), name: n, side, sent: false, createdAt: new Date().toISOString() });
      save();
      $("#new-name").value = "";
      setNameError("");
      render();
      toast(`${n} 님을 추가했어요`);
    });

    /* add many */
    $("#bulk-add").addEventListener("click", () => {
      const names = $("#bulk-names").value.split(/[\n,]/).map(cleanName).filter(Boolean);
      const side = $('input[name="bulk-side"]:checked').value;
      const seen = new Set(state.guests.map((g) => g.name));
      const fresh = [];
      let skipped = 0;
      names.forEach((n) => {
        if (seen.has(n)) { skipped += 1; return; }
        seen.add(n);
        fresh.push({ id: newId(), name: n, side, sent: false, createdAt: new Date().toISOString() });
      });
      if (!fresh.length) { toast(skipped ? "모두 이미 목록에 있는 이름이에요" : "추가할 이름이 없어요"); return; }
      state.guests = [...fresh.reverse(), ...state.guests];
      save();
      $("#bulk-names").value = "";
      render();
      toast(`${fresh.length}명을 추가했어요${skipped ? ` (중복 ${skipped}명 제외)` : ""}`);
    });

    /* search + filter */
    $("#search").addEventListener("input", (e) => { state.query = e.target.value; render(); });
    document.querySelectorAll('input[name="filter"]').forEach((r) => r.addEventListener("change", () => { state.filter = r.value; render(); }));

    /* bulk actions */
    $("#copy-all").addEventListener("click", async () => {
      const vis = visible();
      if (!vis.length) return;
      const ok = await copyText(vis.map((g) => `${g.name}\t${buildLink(state.base, g.name)}`).join("\n"));
      toast(ok ? `링크 ${vis.length}개를 복사했어요` : "복사하지 못했어요");
    });
    $("#export-csv").addEventListener("click", () => {
      const vis = visible();
      if (!vis.length) return;
      const cell = (v) => `"${String(v).replace(/"/g, '""')}"`;
      const rows = [["이름", "구분", "초대 링크", "보냄"], ...vis.map((g) => [g.name, g.side, buildLink(state.base, g.name), g.sent ? "O" : ""])];
      const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url; a.download = "초대링크_연학_은미.csv";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    /* row actions */
    function saveEdit(id) {
      const input = $("[data-edit-input]");
      const n = cleanName(input ? input.value : "");
      if (!n) { state.editError = "이름을 입력해 주세요."; render(); return; }
      if (isDuplicate(n, id)) { state.editError = DUP_MSG; render(); return; }
      state.guests = state.guests.map((g) => (g.id === id ? { ...g, name: n } : g));
      state.editing = null; state.editError = "";
      save(); render();
      const row = document.querySelector(`[data-id="${id}"] [data-act="edit"]`);
      if (row) row.focus();
    }
    $("#list").addEventListener("click", async (e) => {
      const el = e.target.closest("[data-act]");
      if (!el) return;
      const id = el.closest("[data-id]").dataset.id;
      const g = state.guests.find((x) => x.id === id);
      if (!g) return;
      const act = el.dataset.act;
      if (act === "copy") {
        toast((await copyText(buildLink(state.base, g.name))) ? `${g.name} 님 링크를 복사했어요` : "복사하지 못했어요. 링크를 길게 눌러 복사해 주세요");
      } else if (act === "edit") {
        state.editing = id; state.editError = ""; state.confirming = null; render();
      } else if (act === "save") {
        saveEdit(id);
      } else if (act === "cancel-edit") {
        state.editing = null; state.editError = ""; render();
        const b = document.querySelector(`[data-id="${id}"] [data-act="edit"]`); if (b) b.focus();
      } else if (act === "confirm") {
        state.confirming = id; render();
        const b = document.querySelector(`[data-id="${id}"] [data-act="cancel-delete"]`); if (b) b.focus();
      } else if (act === "cancel-delete") {
        state.confirming = null; render();
        const b = document.querySelector(`[data-id="${id}"] [data-act="confirm"]`); if (b) b.focus();
      } else if (act === "delete") {
        state.guests = state.guests.filter((x) => x.id !== id);
        state.confirming = null; save(); render();
        toast(`${g.name} 님을 삭제했어요`);
      }
    });
    $("#list").addEventListener("change", (e) => {
      if (e.target.dataset.act !== "sent") return;
      const id = e.target.closest("[data-id]").dataset.id;
      state.guests = state.guests.map((g) => (g.id === id ? { ...g, sent: e.target.checked } : g));
      save(); render();
      const cb = document.querySelector(`[data-id="${id}"] [data-act="sent"]`); if (cb) cb.focus();
    });
    $("#list").addEventListener("keydown", (e) => {
      if (!e.target.matches("[data-edit-input]")) return;
      const id = e.target.closest("[data-id]").dataset.id;
      if (e.key === "Enter") { e.preventDefault(); saveEdit(id); }
      if (e.key === "Escape") { state.editing = null; state.editError = ""; render(); }
    });

    render();
  })();
  </script>
</body>
</html>
